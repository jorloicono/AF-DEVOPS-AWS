name: Sonda del emulador
on:
  workflow_dispatch:
  push:
    paths: [".github/sonda.sh", ".github/workflows/sonda.yml"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
      AWS_REGION: eu-west-1
      AWS_PAGER: ""
    steps:
      - uses: actions/checkout@v4
      - run: docker pull python:3.12-slim && bash .devcontainer/arrancar-emulador.sh
      - run: bash .github/sonda.sh > sonda.txt 2>&1 || true
      - name: Guardar
        if: always()
        run: |
          set +e
          docker logs emulador-aws > emulador.log 2>&1
          git config user.name "sonda"; git config user.email "sonda@users.noreply.github.com"
          git checkout --orphan sonda-resultados
          git rm -rq --cached . ; git add -f sonda.txt emulador.log
          git commit -qm "Sonda $GITHUB_RUN_ID"; git push -qf origin sonda-resultados
