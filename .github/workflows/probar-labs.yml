name: Probar laboratorios en el emulador
on:
  workflow_dispatch:
    inputs:
      labs: { description: 'Labs a probar', default: '01 02 03 04' }
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
      AWS_REGION: eu-west-1
      AWS_PAGER: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet cfn-lint pytest==8.3.3 ruff==0.6.9 && docker pull python:3.12-slim && bash .devcontainer/arrancar-emulador.sh
      - name: Lab 01
        if: contains(inputs.labs, '01')
        run: python .github/ejecutar-lab.py practicas/Lab01_cloudformation/Lab01_cloudformation.md > lab01.sh && timeout 900 bash -x lab01.sh > lab01.txt 2>&1 || true
      - name: Lab 02
        if: contains(inputs.labs, '02')
        run: python .github/ejecutar-lab.py practicas/Lab02_codebuild/Lab02_codebuild.md > lab02.sh && timeout 900 bash -x lab02.sh > lab02.txt 2>&1 || true
      - name: Lab 03
        if: contains(inputs.labs, '03')
        run: python .github/ejecutar-lab.py practicas/Lab03_codepipeline/Lab03_codepipeline.md > lab03.sh && timeout 900 bash -x lab03.sh > lab03.txt 2>&1 || true
      - name: Lab 04
        if: contains(inputs.labs, '04')
        run: python .github/ejecutar-lab.py practicas/Lab04_canary_rollback/Lab04_canary_rollback.md > lab04.sh && timeout 900 bash -x lab04.sh > lab04.txt 2>&1 || true
      - name: Guardar resultados
        if: always()
        run: |
          docker logs emulador-aws > emulador.log 2>&1 || true
          git config user.name "pruebas"; git config user.email "pruebas@users.noreply.github.com"
          git checkout --orphan resultados-labs
          git rm -rq --cached . ; touch lab01.txt lab02.txt lab03.txt lab04.txt; git add -f lab0*.txt emulador.log
          git commit -qm "Resultados $GITHUB_RUN_ID"
          git push -qf origin resultados-labs
